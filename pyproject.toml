[project]
name = "rrisk"
version = "0.1.0"
description = "Site-level hazard, loss-event and failure risk scoring for US wind, solar and battery sites"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "shapely>=2.0",
]

[project.scripts]
rrisk = "rrisk.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rrisk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
